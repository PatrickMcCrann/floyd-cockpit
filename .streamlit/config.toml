# The chart palette and custom CSS are designed and validated against the light
# surface (#fcfcfb). Pin the theme so the app renders the same for every reviewer,
# regardless of their OS appearance setting.
[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#f9f9f7"
secondaryBackgroundColor = "#fcfcfb"
textColor = "#0b0b0b"
font = "sans serif"

[browser]
gatherUsageStats = false
